<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, minimal-ui, viewport-fit=cover" />
    <title>Messenger by Abeto</title>
    <link rel="stylesheet" crossorigin="" href="/assets/style-BgpnrCnL.css" />
    <link rel="modulepreload" crossorigin="" href="/assets/App3D-DwM1eiaC.js" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #fff;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #app {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(220,38,38,0.95);color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(el);
        }
        el.textContent += '\n[ERROR] ' + e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(220,38,38,0.95);color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(el);
        }
        el.textContent += '\n[PROMISE REJECTION] ' + (e.reason?.stack || e.reason?.message || e.reason);
      });
    </script>
  </head>
  <body>
    <script type="module" crossorigin="" src="/assets/webgl-CS4l6lxD.js"></script>
  </body>
</html>
