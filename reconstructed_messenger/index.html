<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, minimal-ui, viewport-fit=cover" />
    <title>Messenger by Abeto — Clean-Room Reconstruction</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f7f3ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(220,38,38,0.95);color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(el);
        }
        el.textContent += '\n[ERROR] ' + e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(220,38,38,0.95);color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(el);
        }
        el.textContent += '\n[PROMISE REJECTION] ' + (e.reason?.stack || e.reason?.message || e.reason);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
